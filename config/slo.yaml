service: day13-observability-lab
window: 28d
slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    note: 99.5% of rolling 28-day five-minute windows keep P95 at or below 3000 ms.
  error_rate_pct:
    objective: 2
    target: 99.0
    note: 99% of rolling 28-day five-minute windows keep request failures at or below 2%.
  daily_cost_usd:
    objective: 2.5
    target: 100.0
    note: Daily spend remains at or below USD 2.50 throughout the 28-day window.
  quality_score_avg:
    objective: 0.75
    target: 95.0
    note: 95% of rolling 28-day fifteen-minute windows keep mean quality at or above 0.75.
