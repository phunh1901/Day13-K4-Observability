alerts:
  - name: HighTailLatency
    severity: warning
    condition: latency_p95_ms > 2000 for 5m
    type: symptom-based
    owner: api-on-call
    runbook: docs/alerts.md#alert-1
  - name: HighRequestErrorRate
    severity: critical
    condition: error_rate_pct > 2 for 5m and request_count >= 20
    type: symptom-based
    owner: api-on-call
    runbook: docs/alerts.md#alert-2
  - name: DailyCostBudgetRisk
    severity: warning
    condition: projected_daily_cost_usd > 2.5 for 15m
    type: symptom-based
    owner: ai-platform-on-call
    runbook: docs/alerts.md#alert-3
